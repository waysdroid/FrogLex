name: Publish Chrome and Edge installers

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

permissions:
  contents: write

concurrency: vocabulary-installers-${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    if: github.repository == 'waysdroid/read-frog' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      HUSKY: "0"
      WXT_SKIP_ENV_VALIDATION: "true"
      SKIP_FREE_API: "true"
    steps:
      - name: Verify the release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Build and verify installers
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm type-check
          pnpm test --pool=threads --maxWorkers=2 \
            src/utils/personal-vocabulary src/utils/webdav-sync src/utils/config/__tests__/init.test.ts \
            src/utils/config/__tests__/migration-scripts src/components/custom-action \
            src/components/ui/selection-popover src/entrypoints/options/app-sidebar
          pnpm zip
          pnpm zip:edge
          mkdir release-assets
          cp node_modules/@read-frog/layout-engine/LICENSE "$RUNNER_TEMP/LICENSE.layout-engine.txt"
          shopt -s nullglob
          for browser in chrome edge; do
            sources=(.output/*-"${browser}".zip)
            test "${#sources[@]}" -eq 1
            archive="release-assets/read-frog-personal-vocabulary-${RELEASE_TAG}-${browser}.zip"
            cp "${sources[0]}" "$archive"
            zip -jq "$archive" LICENSE "$RUNNER_TEMP/LICENSE.layout-engine.txt"
            unzip -tq "$archive"
            cmp <(unzip -p "$archive" manifest.json) ".output/${browser}-mv3/manifest.json"
            sha256sum "$archive"
          done
      - name: Prepare release notes
        shell: bash
        run: |
          notes="$RUNNER_TEMP/vocabulary-new-release-notes.md"
          version="V${RELEASE_TAG#v}"
          awk -v version="$version" '
            $1 == "##" { if (found) exit; found = ($2 == version) }
            found { print }
          ' CHANGELOG.personal-vocabulary.md > "$notes"
          test -s "$notes"
          cat >> "$notes" <<'MARKDOWN'

          ### 安装扩展

          在下方 Assets 下载对应浏览器的 ZIP 并解压。在 Chrome 或 Edge 的扩展管理页开启开发者模式，选择「加载已解压的扩展程序」，然后选择包含 `manifest.json` 的目录。

          升级时保留现有扩展，将新版文件解压到原安装目录，再在扩展管理页点击「重新加载」。使用同一浏览器配置和扩展 ID，可保留已有词库、设置和 API 密钥。
          MARKDOWN
      - name: Attach the Chrome and Edge installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            version="V${RELEASE_TAG#v}"
            gh release create "$RELEASE_TAG" release-assets/*.zip --verify-tag \
              --repo "$GITHUB_REPOSITORY" --title "个人词库 $version" \
              --notes-file "$RUNNER_TEMP/vocabulary-new-release-notes.md"
            exit 0
          fi
          existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          pending=()
          for archive in release-assets/*.zip; do
            if ! grep -Fxq -- "${archive##*/}" <<< "$existing"; then
              pending+=("$archive")
            fi
          done
          if ((${#pending[@]})); then
            gh release upload "$RELEASE_TAG" "${pending[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].url'
