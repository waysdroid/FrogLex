name: Publish personal vocabulary source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-vocabulary-source.yml
    tags:
      - v0.1.0
  workflow_dispatch:

concurrency: personal-vocabulary-source-v0.1.0

jobs:
  publish:
    if: github.repository_id == '1470196653'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v0.1.0
      - name: Publish the source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.1.0 --verify-tag --prerelease \
            --title "个人词库 V0.1.0 源码预发行" \
            --notes-file CHANGELOG.personal-vocabulary.md
